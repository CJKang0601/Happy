<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kevin Kang 專屬幸運抽獎</title>
  <meta name="description" content="Kevin Kang 的退休與生日驚喜抽獎頁面。">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page-shell">
    <section class="lottery-panel" aria-live="polite">
      <div class="intro" id="intro">
        <p class="eyebrow">Kevin Kang 專屬禮物抽獎</p>
        <h1>恭喜你是今天的幸運得主</h1>
        <p class="message">Kevin，請按下按鈕，抽出這份退休與生日的驚喜禮物。</p>
        <button class="draw-button" id="drawButton" type="button">
          <span class="button-text">開始抽獎</span>
          <span class="button-shine" aria-hidden="true"></span>
        </button>
      </div>

      <div class="loading" id="loading" hidden>
        <div class="curtain-stage" aria-hidden="true">
          <div class="curtain curtain-left"></div>
          <div class="curtain curtain-right"></div>
          <div class="curtain-valance"></div>
        </div>
        <div class="loading-copy">
          <div class="spinner" aria-hidden="true"></div>
          <p>正在確認 Kevin Kang 的幸運禮物...</p>
        </div>
      </div>

      <div class="result" id="result" hidden>
        <div class="confetti" aria-hidden="true">
          <span></span><span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span><span></span>
        </div>
        <p class="eyebrow">Kevin Kang 的中獎結果</p>
        <h2>恭喜抽中大獎！</h2>
        <p class="prize-name">Garmin Forerunner 165</p>
        <div class="prize-stage">
          <span class="winner-badge">Grand Prize</span>
          <img src="assets/images/garmin_Forrunner165.jpg" alt="Garmin Forerunner 165 運動智慧手錶獎品圖" class="watch-image">
        </div>
        <div class="wish-card">
          <p>退休快樂，生日快樂！</p>
          <p>祝 Kevin Kang 身體健康，萬事如意。</p>
        </div>
        <p class="note">這份禮物已經被你抽中，請找主辦人兌獎。</p>
        <button class="reset-button" id="resetButton" type="button">再看一次</button>
        <div class="applauders" aria-hidden="true">
          <div class="person person-mom">
            <span class="hair"></span>
            <span class="head"></span>
            <span class="body"></span>
            <span class="arm arm-left"></span>
            <span class="arm arm-right"></span>
          </div>
          <div class="person person-child">
            <span class="hair"></span>
            <span class="head"></span>
            <span class="body"></span>
            <span class="arm arm-left"></span>
            <span class="arm arm-right"></span>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
